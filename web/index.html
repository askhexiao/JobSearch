<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniFit100 | Job Search — 免费职位订阅</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <img class="logo" src="/logo.png" alt="UniFit100 | Job Search" />
      <p class="tagline">订阅您感兴趣的公开职位，免费推送到邮箱</p>
    </header>

    <section class="card">
      <form id="subscribe-form" novalidate>
        <!-- 职位名称 -->
        <div class="field">
          <label>职位名称 <span class="req">*</span>
            <span class="hint">（最多 5 个）</span>
          </label>
          <div id="title-list"></div>
          <button type="button" id="add-title" class="add-link">+ 添加职位名称</button>
        </div>

        <!-- 招聘类型 -->
        <div class="field">
          <label for="recruit-type">招聘类型 <span class="req">*</span></label>
          <select id="recruit-type" name="recruit_type">
            <option value="校招" selected>校招</option>
            <option value="社招">社招</option>
          </select>
        </div>

        <!-- 订阅邮箱 -->
        <div class="field">
          <label for="email">订阅邮箱 <span class="req">*</span></label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>

        <!-- 工作地点（省-市-县联动） -->
        <div class="field">
          <label>工作地点 <span class="req">*</span></label>
          <div id="location-list"></div>
          <button type="button" id="add-location" class="add-link">+ 添加工作地点</button>
        </div>

        <!-- 岗位发布时长 -->
        <div class="field">
          <label for="publish-within">岗位发布时长 <span class="req">*</span></label>
          <select id="publish-within" name="publish_within">
            <option value="最近1周">最近 1 周</option>
            <option value="最近2周">最近 2 周</option>
            <option value="最近1个月" selected>最近 1 个月</option>
            <option value="最近3个月">最近 3 个月</option>
            <option value="不限">不限</option>
          </select>
        </div>

        <!-- 意向雇主 -->
        <div class="field">
          <label for="employer-db">意向雇主</label>
          <select id="employer-db" name="employer_db">
            <option value="UniFit100 优质雇主数据库 - 2027" selected>UniFit100 优质雇主数据库 - 2027</option>
          </select>
        </div>

        <!-- 推送频率 -->
        <div class="field">
          <label for="frequency">推送频率 <span class="req">*</span></label>
          <select id="frequency" name="frequency">
            <option value="每周1次" selected>每周 1 次</option>
            <option value="每天1次">每天 1 次</option>
          </select>
        </div>

        <label class="check-line consent">
          <input type="checkbox" id="consent" required />
          <span>我已阅读并同意：仅将邮箱用于职位推送，且可随时退订。</span>
        </label>

        <button type="submit" class="submit-btn" id="submit-btn">立即订阅</button>
        <button type="button" class="unsub-btn" id="unsub-btn" hidden>退订</button>
        <p id="status" class="status" role="status"></p>
      </form>
    </section>

    <footer class="footer">
      <p>投递简历需回到招聘官网 · 本项目不替代任何平台</p>
      <p>职业规划 / 面试辅导免费预约：<a href="https://unifit100.com/consultant" target="_blank" rel="noopener">unifit100.com/consultant</a></p>
    </footer>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
